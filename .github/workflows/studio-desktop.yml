name: Studio desktop

# Build the Studio desktop app for macOS: one universal (arm64 + x86_64)
# dmg and zip. With the signing secrets (docs/studio-desktop.md lists them)
# the app and the dmg are signed with a Developer ID, notarized and stapled.
# Without them the build is ad-hoc signed only, and the job still passes.

on:
  workflow_dispatch:
  push:
    tags: ["studio-v*"]

permissions:
  contents: read

concurrency:
  group: studio-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # `secrets` cannot be used in `if:`, so the steps test these instead.
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/studio-v')
        working-directory: studio-desktop
        run: |
          version="$(bun -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "studio-v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match studio-desktop/package.json version ${version}"
            exit 1
          fi

      # The desktop build copies the preview player page from the kit's web
      # build (dist/web), which needs the wasm core: the same steps as the
      # Pages workflow.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache the wasm core build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/pocketjs/engine/wasm/target
          key: ${{ runner.os }}-pocketjs-wasm-${{ hashFiles('vendor/pocketjs/engine/wasm/Cargo.lock', 'vendor/pocketjs/engine/wasm/Cargo.toml', 'vendor/pocketjs/engine/core/Cargo.toml', 'vendor/pocketjs/engine/wasm/src/**', 'vendor/pocketjs/engine/core/src/**') }}
          restore-keys: ${{ runner.os }}-pocketjs-wasm-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the wasm core
        run: bun run build:wasm

      - name: Build the site
        run: bun run web

      - name: Install the desktop dependencies
        working-directory: studio-desktop
        run: bun install --frozen-lockfile

      # Compiles the helper for both architectures and lipo's them into one
      # universal binary.
      - name: Build the desktop app
        working-directory: studio-desktop
        env:
          HELPER_TARGETS: bun-darwin-arm64,bun-darwin-x64
        run: bun run build

      - name: Set up signing
        if: env.HAS_MAC_CERT == 'true'
        working-directory: studio-desktop
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/ci-mac-signing.sh setup

      - name: Sign the helper
        if: env.HAS_MAC_CERT == 'true'
        working-directory: studio-desktop
        run: bash scripts/ci-mac-signing.sh sign-helper

      # Signs the app (the helper is already signed), notarizes and staples
      # it when the API key is set, then builds the dmg and zip from it.
      - name: Package (Developer ID)
        if: env.HAS_MAC_CERT == 'true'
        working-directory: studio-desktop
        run: >-
          ./node_modules/.bin/electron-builder --mac --universal --publish never
          '-c.mac.signIgnore=/Contents/Resources/helper/rpgkit-studio-helper$'

      # Ad-hoc signing keeps the fuse-flipped Electron binary runnable on
      # Apple Silicon; without a Developer ID the hardened runtime buys nothing.
      - name: Package (unsigned)
        if: env.HAS_MAC_CERT != 'true'
        working-directory: studio-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          echo "::notice::MAC_CERT_P12_BASE64 is not set: building an unsigned (ad-hoc signed) app. Gatekeeper will block it until the user allows it."
          ./node_modules/.bin/electron-builder --mac --universal --publish never \
            -c.mac.identity=- -c.mac.hardenedRuntime=false
          codesign --verify --deep --strict --verbose=2 "dist/mac-universal/Pocket RPG Kit Studio.app"

      - name: Verify the app
        if: env.HAS_MAC_CERT == 'true'
        working-directory: studio-desktop
        run: bash scripts/ci-mac-signing.sh verify-app "dist/mac-universal/Pocket RPG Kit Studio.app"

      # electron-builder notarizes and staples only the app; the dmg is
      # signed, notarized and stapled here.
      - name: Sign, notarize and staple the dmg
        if: env.HAS_MAC_CERT == 'true'
        working-directory: studio-desktop
        run: bash scripts/ci-mac-signing.sh dmg dist/*.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: studio-desktop-mac-${{ env.HAS_MAC_CERT == 'true' && 'signed' || 'unsigned' }}
          path: |
            studio-desktop/dist/*.dmg
            studio-desktop/dist/*.zip
            studio-desktop/dist/*.blockmap
            studio-desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

      - name: Remove the signing keychain and API key
        if: always() && env.HAS_MAC_CERT == 'true'
        working-directory: studio-desktop
        run: |
          if [ -f scripts/ci-mac-signing.sh ]; then bash scripts/ci-mac-signing.sh cleanup; fi
