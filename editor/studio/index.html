<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket RPG Kit Studio</title>
<meta name="description" content="A browser map and event editor for Pocket RPG Kit projects. Your project stays in this browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l7 7-7 7-7-7z%22 fill=%22%237c9cff%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="studio.css">
<!-- The page calls no browser APIs itself. Each host supplies its own boot
     snippet (the pre-paint theme pick): the browser host's is put in place of
     the marker below at build time (tools/studio-build.ts); a desktop shell
     uses its own page. -->
<!-- studio:host-boot -->
<script type="module" src="studio.js"></script>
</head>
<body>
<div class="studio">
  <header class="toolbar" id="toolbar" role="toolbar" aria-label="Studio toolbar"></header>
  <aside class="left" aria-label="Maps and tiles">
    <section class="panel maps" id="maps"></section>
    <section class="panel palette" id="palette"></section>
  </aside>
  <main class="center">
    <div class="center-row">
      <div class="canvas-host" id="canvas-host"></div>
      <section class="playtest" id="playtest" hidden aria-label="Play-test"></section>
      <section class="agent" id="agent" hidden aria-label="Agent"></section>
    </div>
    <section class="problems" id="problems" hidden aria-label="Problems"></section>
  </main>
  <aside class="right" aria-label="Inspector">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="active" aria-selected="true" data-tab="inspector">Inspector</button>
      <button type="button" role="tab" aria-selected="false" data-tab="history">History</button>
    </div>
    <section class="panel inspector" id="inspector"></section>
    <section class="panel history" id="history" hidden></section>
  </aside>
  <footer class="statusbar" id="statusbar" role="status"></footer>
</div>
<div class="notices" id="notices" aria-live="polite"></div>
<noscript><p class="noscript">Studio needs JavaScript.</p></noscript>
</body>
</html>
